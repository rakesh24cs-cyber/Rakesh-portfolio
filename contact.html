<main>
<section id="contact">
  <h1 class="page-title">Contact</h1>
  <p class="sub">Have an internship, a project or a question? Write to me and I’ll reply as soon as I can.</p>
  <form id="form" novalidate>
    <div class="row">
      <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-err"><p class="error" id="name-err"></p></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err"><p class="error" id="email-err"></p></div>
    </div>
    <div class="field"><label for="subject">Subject</label><input id="subject" name="subject" type="text" required aria-describedby="subject-err"><p class="error" id="subject-err"></p></div>
    <div class="field"><label for="message">Message</label><textarea id="message" name="message" required aria-describedby="message-err"></textarea><p class="error" id="message-err"></p></div>
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn btn-fill" type="submit">Send message</button>
    <p class="formstatus" id="status" role="status"></p>
  </form>
</section>
<footer class="site-foot">© <span id="year"></span> Rakesh Poria</footer>
